name: dynamic_flutter_app
description: Server-driven Flutter Runtime Platform powered by STAC.
publish_to: 'none'
version: 2.1.0+2

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  stac: ^1.5.0
  stac_framework: ^1.0.0
  dio: ^5.11.0
  drift: ^2.34.3
  flutter_secure_storage: ^10.3.1
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  image_picker: ^1.2.3
  file_picker: ^12.0.0
  share_plus: ^13.3.0
  local_auth: ^3.0.2
  geolocator: ^14.0.3
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.3
  build_runner: ^2.10.4

flutter:
  uses-material-design: true
  assets:
    - assets/samples/bootstrap_schema.json
    - assets/samples/runtime_manifest.json
    - assets/samples/runtime_form.json
