name: dynamic_flutter_app
description: Server-driven Flutter Runtime Platform powered by STAC.
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  stac: ^1.5.0
  http: ^1.5.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/samples/bootstrap_schema.json
