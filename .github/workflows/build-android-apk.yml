name: Runtime CI

on:
  push:
    branches: [main, server-driven-runtime-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Format source
        run: dart format lib test

      - name: Commit formatter changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/server-driven-runtime-v2'
        run: |
          if git diff --quiet; then
            echo 'No formatter changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          git commit -m 'style(runtime): apply dart format'
          git push origin HEAD:server-driven-runtime-v2

      - name: Format check
        run: git diff --exit-code -- lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
